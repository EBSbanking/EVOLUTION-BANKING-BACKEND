version: '3.8'

services:
  # --- Nginx Load Balancer (fronts the backend replicas) ---
  nginx-lb:
    image: nginx:alpine
    container_name: evolution-lb
    ports:
      - "3002:80"                    # Expose port 3002 to the host
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

  # --- Backend (scalable replicas) ---
  backend:
    build:
      context: ./EVOLUTION\ BANKING\ BACKEND
      dockerfile: Dockerfile
    # No `ports` defined here – the load balancer will route to the container's internal port 3002
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET}
      - DB_HOST=postgres
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=3002                     # internal port
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock   # needed for dockerode restart
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3002/api/admin/server/status', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      mode: replicated
      replicas: 3                     # adjust as needed

  # --- Frontend (React Admin) ---
  frontend:
    build:
      context: ./Admin-ui
      dockerfile: Dockerfile
    container_name: evolution-frontend
    ports:
      - "3000:80"
    restart: unless-stopped
    depends_on:
      - backend

  # --- PostgreSQL ---
  postgres:
    image: postgres:15-alpine
    container_name: evolution-db
    environment:
      POSTGRES_DB: ${DB_NAME:-evolution}
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-securepass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin} -d ${DB_NAME:-evolution}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Redis ---
  redis:
    image: redis:7-alpine
    container_name: evolution-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: